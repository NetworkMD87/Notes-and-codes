name: CI

# Runs on Windows because that is the only platform this app targets — a Linux runner would be
# cheaper and would prove nothing about the paths that actually break here (registry writes,
# the tray, path handling, atomicWrite's rename semantics on NTFS).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Use npm 11 with install-script allowlists
        run: npm install --global npm@11.19.0

      - run: npm ci

      # `npm run build` is `tsc --noEmit` THEN electron-vite build. The type-check half is the
      # real gate: esbuild alone does not type-check, so IPC/type breakage across the
      # main/preload/renderer boundary is invisible without it.
      - name: Type-check + build
        run: npm run build

      - name: Unit tests
        run: npm test

  # Manual dispatch only — NOT a gate on push/PR, deliberately.
  #
  # This suite drives a real Electron window, and GitHub-hosted Windows runners do not reliably
  # paint Monaco's viewport. Measured across two runs: 77-78 of 87 pass, and the failures are
  # always the same set — every test that asserts on RENDERED editor content (highlighter
  # decorations, reformatted text, the pen cursor) rather than on chrome outside Monaco's
  # virtualised viewport. Tripling the timeouts (10s->30s expect, 30s->90s per test) changed
  # nothing, which is what rules out slowness as the cause: the text never arrives at all.
  #
  # So the suite is sound and the environment is not. Gating the badge on it would mean a red
  # master that says nothing about the code — worse than no signal. It stays a local pre-release
  # gate (see tests/CLAUDE.md) and can still be run here on demand.
  #
  # Worth revisiting with software rendering (--use-gl=swiftshader / --disable-gpu) on the
  # Electron launch args, which may be what the runner actually needs.
  smoke:
    name: Smoke tests (Playwright + Electron)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Use npm 11 with install-script allowlists
        run: npm install --global npm@11.19.0

      - run: npm ci

      # The smoke suite launches the BUILT app from out/main/index.js, so this is required.
      - name: Build
        run: npm run build

      # playwright.config.ts sets NC_HEADLESS before workers spawn, so the app skips global-hotkey
      # registration — a CI job seizing an OS-level hotkey would be both rude and flaky.
      - name: Smoke tests
        run: npm run test:smoke

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
