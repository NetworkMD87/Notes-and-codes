name: CI

# Runs on Windows because that is the only platform this app targets — a Linux runner would be
# cheaper and would prove nothing about the paths that actually break here (registry writes,
# the tray, path handling, atomicWrite's rename semantics on NTFS).
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      rendering:
        description: Electron smoke rendering trial
        type: choice
        default: disable-gpu
        options: [native, disable-gpu, swiftshader]
      scope:
        description: Focused rendering checks or full suite
        type: choice
        default: focused
        options: [focused, full]

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Use npm 11 with install-script allowlists
        run: npm install --global npm@11.19.0

      - run: npm ci

      # `npm run build` is `tsc --noEmit` THEN electron-vite build. The type-check half is the
      # real gate: esbuild alone does not type-check, so IPC/type breakage across the
      # main/preload/renderer boundary is invisible without it.
      - name: Type-check + build
        run: npm run build

      - name: Unit tests
        run: npm test

  # Manual dispatch only — NOT a gate on push/PR, deliberately.
  #
  # This suite drives a real Electron window, and GitHub-hosted Windows runners do not reliably
  # paint Monaco's viewport. Measured across two runs: 77-78 of 87 pass, and the failures are
  # always the same set — every test that asserts on RENDERED editor content (highlighter
  # decorations, reformatted text, the pen cursor) rather than on chrome outside Monaco's
  # virtualised viewport. Tripling the timeouts (10s->30s expect, 30s->90s per test) changed
  # nothing, which is what rules out slowness as the cause: the text never arrives at all.
  #
  # So the suite is sound and the environment is not. Gating the badge on it would mean a red
  # master that says nothing about the code — worse than no signal. Relevant UI changes are
  # checked locally; the release checklist selects focused or broader coverage based on risk.
  # The full suite can still be run here on demand.
  #
  # Manual inputs trial native, GPU-disabled, or ANGLE/SwiftShader rendering without
  # changing the installed app. Compare focused checks first, then repeated full runs.
  smoke:
    name: Smoke tests (Playwright + Electron)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      NC_SMOKE_RENDERING: ${{ inputs.rendering }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Use npm 11 with install-script allowlists
        run: npm install --global npm@11.19.0

      - run: npm ci

      # The smoke suite launches the BUILT app from out/main/index.js, so this is required.
      # Electron 42+ no longer downloads its runtime during npm ci. Do this before test
      # collection so a first-time download cannot consume an Electron launch timeout.
      - name: Download Electron runtime
        run: node node_modules/electron/install.js

      - name: Build
        run: npm run build

      # playwright.config.ts sets NC_HEADLESS before workers spawn, so the app skips global-hotkey
      # registration — a CI job seizing an OS-level hotkey would be both rude and flaky.
      - name: Smoke tests
        shell: pwsh
        run: |
          Remove-Item env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          if ('${{ inputs.scope }}' -eq 'focused') {
            npx playwright test tests/smoke/format-manual.spec.ts tests/smoke/highlighter.spec.ts --reporter=line,json --trace=retain-on-failure
          } else {
            npx playwright test --reporter=line,json --trace=retain-on-failure
          }
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/results.json

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ inputs.rendering }}-${{ inputs.scope }}
          path: test-results/
          retention-days: 7
